---

- name: Gather Service Facts
  ansible.builtin.service_facts:
  tags: 
  - hardening
  - ufw-config

- name: Stop And Disable `ufw` Service
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: no
  tags: 
  - hardening
  - ufw-config
  when: 
    - "'ufw.service' in ansible_facts.services"
    - "ansible_facts.services['ufw.service'].status != 'not-found'"

- name: Stop and Disable `postfix` Service
  ansible.builtin.systemd:
    name: postfix
    state: stopped
    enabled: false
  when:
    - "'postfix.service' in ansible_facts.services"
    - ansible_facts.services['postfix.service'].status | default('not-found') != 'not-found'
  tags: 
  - hardening
  - postfix-config

- name: Make Timout Configuration File
  template:
    src: timout.j2
    dest: /etc/profile.d/timout-settings.sh
  tags: 
  - hardening
  - timeout-config

- name: Set Timezone To Asia/Tehran
  community.general.timezone:
    name: Asia/Tehran
  notify: Restart ntp
  tags: 
  - hardening
  - time-config

- name: Make `iptables` Configuration File
  template:
    src: iptables.j2
    dest: /etc/iptables/rules.v4
  tags: 
  - hardening
  - iptables-config

- name: Restore `iptables` state from a file
  community.general.iptables_state:
    state: restored
    path: "{{ iptables_rules_file | default('/etc/iptables/rules.v4') }}"
    noflush: false
    wait: 10    # wait for lock
  async: "{{ ansible_timeout | default(60) }}"
  poll: 0
  become: yes
  tags: 
  - hardening
  - iptables-config

- name: Make `fail2ban` Configuration File
  template:
    src: fial2ban.j2
    dest: /etc/fail2ban/jail.local
  notify: Restart fail2ban
  tags: 
  - hardening
  - fail2ban-config

...